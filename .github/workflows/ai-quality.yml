name: AI quality contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      AI_EVAL_SAMPLING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run db:generate
      - run: npm run test:evals
      - run: npm run evals -- --mode FAST_SMOKE --out /tmp/ai-quality-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-quality-report
          path: /tmp/ai-quality-smoke.json
