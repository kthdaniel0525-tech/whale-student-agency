name: Build staging image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ai-quality.yml
    permissions:
      contents: read

  image:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.result.outputs.app_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR image name and SHA tag
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish reviewed image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output immutable image reference
        id: result
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest format." >&2
            exit 1
          fi
          app_image="$IMAGE_NAME@$IMAGE_DIGEST"
          echo "app_image=$app_image" >> "$GITHUB_OUTPUT"
          echo "$app_image"
          {
            echo "## Staging image build"
            echo
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Immutable APP_IMAGE: \`$app_image\`"
          } >> "$GITHUB_STEP_SUMMARY"
