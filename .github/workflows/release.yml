name: Release containers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ai-quality.yml
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  staging:
    needs: image
    # Dedicated trusted release runner, never used for PRs. Docker/Node24 and
    # /etc/agency/compose.env + secrets are provisioned by the operator.
    runs-on: [self-hosted, agency-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.20.0' }
      - run: npm run install:ci
      - run: node scripts/deploy-release.mjs deploy /etc/agency/compose.env "$APP_IMAGE"
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
      - name: Authenticated synthetic-account smoke
        run: npm run ops:smoke
        env:
          SMOKE_ORIGIN: ${{ vars.APP_URL }}
          SMOKE_COOKIE: ${{ secrets.SMOKE_COOKIE }}
          REQUIRE_AUTHENTICATED_SMOKE: 'true'
      - name: Optional paid synthetic AI and RAG staging check
        if: vars.ENABLE_STAGING_AI_SMOKE == 'true'
        run: node scripts/staging-functional-smoke.mjs
        env:
          APP_ENV: staging
          BILLING_MODE: test
          STAGING_SYNTHETIC_FIXTURE_CONFIRMED: 'true'
          APP_URL: ${{ vars.APP_URL }}
          SMOKE_ORIGIN: ${{ vars.APP_URL }}
          SMOKE_COOKIE: ${{ secrets.SMOKE_COOKIE }}
          SMOKE_COURSE_ID: ${{ vars.SMOKE_COURSE_ID }}
          SMOKE_DOCUMENT_ID: ${{ vars.SMOKE_DOCUMENT_ID }}
      - name: Require reviewed release quality evidence before promotion
        # Prepared on the trusted staging runner, outside the checkout. This
        # read-only gate makes no paid calls and fails closed without evidence.
        run: >-
          node --conditions=react-server --import tsx scripts/check-release-quality.ts
          --baseline /etc/agency/quality/known-good.json
          --report "/etc/agency/quality/${GITHUB_SHA}.json"
  production:
    needs: [image, staging]
    runs-on: [self-hosted, agency-production]
    # Configure required reviewers and main-only deployments in GitHub Settings.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.20.0' }
      - run: npm run install:ci
      - run: node scripts/deploy-release.mjs deploy /etc/agency/compose.env "$APP_IMAGE"
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
          BACKUP_RECEIPT_FILE: /etc/agency/latest-verified-backup.txt
